<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>saml2sts</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1f2328; --muted: #59636e; --bg: #fff; --ok: #1a7f37; --wait: #0969da; --err: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f0f6fc; --muted: #9198a1; --bg: #0d1117; --ok: #3fb950; --wait: #4493f8; --err: #f85149; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 32rem; padding: 0 16px; text-align: center; }
    .mark { font-size: 48px; line-height: 1; }
    [data-state="done"] .mark, [data-state="listed"] .mark { color: var(--ok); }
    [data-state="choose"] .mark { color: var(--wait); }
    [data-state="error"] .mark { color: var(--err); }
    h1 { font-size: 24px; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1></h1>
    <p></p>
  </main>
  <script src="status.js"></script>
</body>
</html>
