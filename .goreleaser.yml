version: 2

builds:
  - main: ./cmd/saml2sts
    binary: saml2sts
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  header: See [CHANGELOG.md](https://github.com/yokonao/saml2sts/blob/{{ .Tag }}/CHANGELOG.md).
